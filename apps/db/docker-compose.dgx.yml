services:
  backend:
    build:
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu130
    gpus: all
    environment:
      CRAVING_INFERENCE_DEVICE: auto
  stt:
    build:
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu130
    gpus: all
    environment:
      STT_DEVICE: cuda
      STT_ALLOW_CPU_FALLBACK: "false"

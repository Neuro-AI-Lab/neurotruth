server {
    listen 3000;

    root /usr/share/nginx/html;
    index index.html;

    # React Router: 모든 경로를 index.html로 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 요청은 백엔드로 프록시
    location /api/ {
        proxy_pass http://backend:25991;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

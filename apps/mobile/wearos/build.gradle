plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.neurotruth.mobile.wear'
    compileSdk 35

    defaultConfig {
        // Same applicationId as the phone app: the Data Layer pairs a wear app with its phone
        // counterpart by package name, and `standalone=false` declares this app cannot stand alone.
        applicationId "com.neurotruth.mobile"
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }
}

dependencies {
    // Verified policy classes live in :core and are shared with the phone app. AlertActionPolicy in
    // particular must not be duplicated here — the watch and the phone have to agree on when an
    // alert is raised.
    implementation project(':core')

    // Samsung Health Sensor SDK. There is no Maven coordinate for it, so the local AAR is required.
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])

    implementation platform('androidx.compose:compose-bom:2024.02.00')

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.activity:activity-compose:1.8.2'

    implementation 'androidx.wear.compose:compose-material:1.3.1'
    implementation 'androidx.wear.compose:compose-foundation:1.3.1'

    implementation 'com.google.android.gms:play-services-wearable:18.1.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'

    testImplementation 'junit:junit:4.13.2'
}

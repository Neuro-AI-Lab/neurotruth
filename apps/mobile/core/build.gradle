plugins {
    id 'org.jetbrains.kotlin.jvm'
}

// Targets Java 17 bytecode using whatever JDK runs Gradle (21 locally), rather than requiring a
// separately installed JDK 17 toolchain.
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    // Android provides org.json at runtime; this is the JVM stand-in for compilation and tests.
    compileOnly 'org.json:json:20240303'
    testImplementation 'org.json:json:20240303'
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(Test).configureEach {
    useJUnit()
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}

version: '3.9'

services:

  # ── DB (PostgreSQL + pgvector) ─────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data      # 데이터 영속성
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql  # 최초 실행 시 초기화
    networks:
      - app-network
    # 포트를 외부에 노출하지 않음 → 백엔드와 내부(로컬) 통신만 허용
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 백엔드 (FastAPI) ───────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LLM_SERVER_URL: ${LLM_SERVER_URL}
      LLM_API_KEY: ${LLM_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy  # DB 완전히 뜬 다음에 백엔드 시작
    networks:
      - app-network

  # ── 프론트엔드 (React + nginx) ─────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - app-network

# ── 네트워크 (컨테이너 간 로컬 통신) ──────────────────────
networks:
  app-network:
    driver: bridge

# ── 볼륨 (DB 데이터 영속성) ───────────────────────────────
volumes:
  postgres_data:

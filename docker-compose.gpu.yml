version: '3.9'

services:

  # ── LLM 서버 (FastAPI + GPU) ───────────────────────────
  llm-server:
    build:
      context: ./llm-server
      dockerfile: Dockerfile
    container_name: llm-server
    restart: unless-stopped
    env_file: .env
    ports:
      - "8001:8001"
    volumes:
      - ./llm-server/models:/app/models  # 로컬 모델 파일 마운트
    networks:
      - llm-network
    # GPU 사용 설정 (로컬 모델 돌릴 때 활성화)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  llm-network:
    driver: bridge
